name: Android Release

# Builds a Release APK. Real signing happens only when the repository has
# these Actions secrets set (never commit keystores or passwords):
#   KEYSTORE_BASE64    base64 of the .jks keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Without them the workflow still builds an UNSIGNED release APK (clearly
# named *-unsigned.apk) — it cannot be installed; it only proves the
# release build (minify/shrink) succeeds. See docs/RELEASE.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore (if secret present)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "No keystore secret — will build an unsigned APK."
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest 2>&1 | tee build-release.log

      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee -a build-release.log
          echo "--- release outputs ---"
          find app/build/outputs/apk/release -name "*.apk" -exec ls -la {} \;

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hisabghor-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Create GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            NOTES="হিসাবঘর ${{ github.ref_name }} — signed release APK."
          else
            NOTES="হিসাবঘর ${{ github.ref_name }} — UNSIGNED build (no signing key configured; cannot be installed as-is)."
          fi
          gh release create ${{ github.ref_name }} app/build/outputs/apk/release/*.apk \
            --title "হিসাবঘর ${{ github.ref_name }}" --notes "$NOTES" || \
          gh release upload ${{ github.ref_name }} app/build/outputs/apk/release/*.apk --clobber

      - name: Mirror failure log to diagnostics issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          touch build-release.log
          {
            echo "### Release CI failed — run ${{ github.run_id }} · commit ${{ github.sha }}"
            echo '```text'
            grep -hE "^e: |error:|FAILURE:|What went wrong|> Task .*FAILED|Execution failed" build-release.log 2>/dev/null | head -n 200
            tail -n 60 build-release.log 2>/dev/null
            echo '```'
          } > comment.md
          head -c 60000 comment.md > comment-trimmed.md
          gh issue comment 1 --body-file comment-trimmed.md
          exit 0
